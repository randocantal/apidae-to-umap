name: Actualisation Donnees Apidae MULTI

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dependances
        run: pip install requests

      - name: Execution du script de conversion
        env:
          APIDAE_API_KEY: ${{ secrets.APIDAE_API_KEY }}
          APIDAE_PROJECT_ID: ${{ secrets.APIDAE_PROJECT_ID }}
        run: |
          python -c "
          import os, requests, json
          
          api_key = os.environ.get('APIDAE_API_KEY', '').strip()
          project_id = os.environ.get('APIDAE_PROJECT_ID', '').strip()
          
          url = 'https://apidae-tourisme.com'
          headers = {'User-Agent': 'Mozilla/5.0'}
          
          # ==========================================================
          # CONFIGURATION : GARDEZ BIEN VOS 6 NUMÉROS DE SÉLECTIONS ICI
          # ==========================================================
          config_selections = {
              'hotels': '188585',       # REMPLACEZ 111111 PAR VOTRE 1ER NUMERO
              'campings': '188587',     # REMPLACEZ 222222 PAR VOTRE 2EME NUMERO
              'gites_etape_sejour': '188586',        # ...
              'chambres_hotes': '188589',     
              'villages_vacance': '188594',
              'refuges': '188593'
          }
          
          fichier_cree = False
          
          for nom_fichier, id_sel in config_selections.items():
              id_propre = str(id_sel).strip()
              if id_propre in ['111111', '222222', '333333', '444444', '555555', '666666'] or not id_propre:
                  continue
                  
              print(f'Interrogation de la selection {id_propre} ({nom_fichier})...')
              
              # Ajout des champs adresse et moyensCommunication requis pour extraire contact/web/tel
              query_structure = {
                  'apiKey': api_key,
                  'projetId': int(project_id) if project_id.isdigit() else project_id,
                  'selectionIds': [int(id_propre)],
                  'responseFields': ['id', 'nom', 'presentation.descriptifCourt', 'localisation.geolocalisation', 'localisation.adresse', 'informations.moyensCommunication'],
                  'count': 600
              }
              
              try:
                  response = requests.get(url, params={'query': json.dumps(query_structure)}, headers=headers, timeout=45)
                  if response.status_code != 200:
                      continue
                  data = response.json()
              except:
                  continue
                  
              objets = data.get('objetsTouristiques', []) if data.get('objetsTouristiques') else data.get('members', [])
              geojson = {'type': 'FeatureCollection', 'features': []}
              
              for item in objets:
                  localisation = item.get('localisation', {})
                  geoloc = localisation.get('geolocalisation', {}) if localisation else {}
                  
                  if geoloc and geoloc.get('valide') is True:
                      geo_json_data = geoloc.get('geoJson', {}) if geoloc else {}
                      pt = geo_json_data.get('coordinates', []) if geo_json_data else []
                      
                      if pt and len(pt) == 2:
                          try:
                              lon = float(pt[0])
                              lat = float(pt[1])
                              
                              # 1. Reconstruction propre de l'Adresse
                              adr_data = localisation.get('adresse', {})
                              lignes = [adr_data.get('adresse1'), adr_data.get('adresse2'), adr_data.get('adresse3')]
                              adresse_complete = ', '.join([l for l in lignes if l])
                              cp_ville = f\"{adr_data.get('codePostal', '')} {adr_data.get('commune', {}).get('nom', '')}\".strip()
                              if cp_ville:
                                  adresse_complete = f\"{adresse_complete}, {cp_ville}\" if adresse_complete else cp_ville
                              
                              # 2. Extraction du Téléphone, Email et Site Web
                              tel, email, web = '', '', ''
                              moyens = item.get('informations', {}).get('moyensCommunication', [])
                              for m in moyens:
                                  type_moyen = m.get('type', {}).get('id')
                                  valeur = m.get('coordonnees', {}).get('fr', '')
                                  if type_moyen == 201: # Code officiel Apidae pour Telephone
                                      tel = valeur
                                  elif type_moyen == 204: # Code officiel Apidae pour Email
                                      email = valeur
                                  elif type_moyen == 205: # Code officiel Apidae pour Site internet
                                      web = valeur
                              
                              geojson['features'].append({
                                  'type': 'Feature',
                                  'geometry': {'type': 'Point', 'coordinates': [lon, lat]},
                                  'properties': {
                                      'name': item.get('nom', {}).get('libelleFr', 'Sans nom'),
                                      'description': item.get('presentation', {}).get('descriptifCourt', {}).get('libelleFr', 'Aucune description.'),
                                      'adresse': adresse_complete if adresse_complete else 'Non renseignée',
                                      'telephone': tel if tel else 'Non renseigné',
                                      'email': email if email else 'Non renseigné',
                                      'web': web if web else 'Non renseigné'
                                  }
                              })
                          except:
                              continue
              
              if geojson['features']:
                  with open(f'{nom_fichier}.geojson', 'w', encoding='utf-8') as f:
                      json.dump(geojson, f, ensure_ascii=False, indent=2)
                  fichier_cree = True
          
          if not fichier_cree:
              exit(1)
          "

      - name: Sauvegarder les modifications sur GitHub
        run: |
          git config --global user.name 'Apidae Bot'
          git config --global user.email 'bot@github.com'
          git add *.geojson
          git commit -m "Ajout des champs coordonnees et contacts" || echo "Aucune modification"
          git push origin HEAD:main || git push --force origin HEAD:main
