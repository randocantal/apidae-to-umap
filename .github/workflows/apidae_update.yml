name: Actualisation Donnees Apidae MULTI

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dependances
        run: pip install requests

      - name: Execution du script de conversion multi-selections
        env:
          APIDAE_API_KEY: ${{ secrets.APIDAE_API_KEY }}
          APIDAE_PROJECT_ID: ${{ secrets.APIDAE_PROJECT_ID }}
        run: |
          python -c "
          import os, requests, json
          
          api_key = os.environ.get('APIDAE_API_KEY', '').strip()
          project_id = os.environ.get('APIDAE_PROJECT_ID', '').strip()
          
          # ==========================================
          # ⚠️ REMPLACEZ LES NUMÉROS CI-DESSOUS PAR VOS VRAIS NUMÉROS APIDAE
          # ==========================================
          selections = {
              'categorie_1': 188585,  # Mettez le 1er numéro de sélection à la place de 111111
              'categorie_2': 188586,  # Mettez le 2ème numéro de sélection à la place de 222222
              'categorie_3': 188587,  # ...
              'categorie_4': 188589,
              'categorie_5': 188593,
              'categorie_6': 188594
          }
          
          url = 'https://apidae-tourisme.com'
          headers = {'User-Agent': 'Mozilla/5.0'}
          
          # Le script va boucler sur vos 6 sélections
          for nom_fichier, id_selection in selections.items():
              print(f'Traitement de la selection {id_selection} ({nom_fichier})...')
              
              query_structure = {
                  'apiKey': api_key,
                  'projetId': int(project_id) if project_id.isdigit() else project_id,
                  'selectionIds': [int(id_selection)],
                  'responseFields': ['id', 'nom', 'presentation.descriptifCourt', 'localisation.geolocalisation'],
                  'count': 400
              }
              
              try:
                  response = requests.get(url, params={'query': json.dumps(query_structure)}, headers=headers, timeout=30)
                  response.raise_for_status()
                  data = response.json()
              except Exception as e:
                  print(f'Erreur sur la selection {id_selection}: {e}')
                  continue
              
              geojson = {'type': 'FeatureCollection', 'features': []}
              objets = data.get('objetsTouristiques', []) if data.get('objetsTouristiques') else data.get('members', [])
              
              for item in objets:
                  localisation = item.get('localisation', {})
                  geoloc = localisation.get('geolocalisation', {}) if localisation else {}
                  if geoloc and geoloc.get('valide') is True:
                      pt = geoloc.get('geoJson', {}).get('coordinates', [])
                      if pt and len(pt) == 2:
                          try:
                              feature = {
                                  'type': 'Feature',
                                  'geometry': {'type': 'Point', 'coordinates': [float(pt[0]), float(pt[1])]},
                                  'properties': {
                                      'name': item.get('nom', {}).get('libelleFr', 'Sans nom'),
                                      'description': item.get('presentation', {}).get('descriptifCourt', {}).get('libelleFr', '')
                                  }
                              }
                              geojson['features'].append(feature)
                          except:
                              continue
              
              # Sauvegarde un fichier distinct pour chaque catégorie
              nom_final = f'{nom_fichier}.geojson'
              with open(nom_final, 'w', encoding='utf-8') as f:
                  json.dump(geojson, f, ensure_ascii=False, indent=2)
              print(f'Fichier {nom_final} genere avec {len(geojson[\"features\"])} points.')
          "

      - name: Sauvegarder les modifications sur GitHub
        run: |
          git config --global user.name 'Apidae Bot'
          git config --global user.email 'bot@github.com'
          git add *.geojson
          git commit -m "Mise à jour des 6 catégories d'hébergements" || echo "Aucune modification"
          git push origin HEAD:main || git push --force origin HEAD:main
