name: Actualisation Donnees Apidae MULTI

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dependances
        run: pip install requests

      - name: Execution du script de conversion multi-selections
        env:
          APIDAE_API_KEY: ${{ secrets.APIDAE_API_KEY }}
          APIDAE_PROJECT_ID: ${{ secrets.APIDAE_PROJECT_ID }}
        run: |
          python -c "
          import os, requests, json
          
          api_key = os.environ.get('APIDAE_API_KEY', '').strip()
          project_id = os.environ.get('APIDAE_PROJECT_ID', '').strip()
          
          # ==========================================
          # ⚠️ METTEZ VOS VRAIS NUMÉROS APIDAE ICI
          # ==========================================
          selections = {
              'hotels': 188585,         # Remplacez 111111 par votre 1er numéro de sélection
              'campings': 188587,       # Remplacez 222222 par votre 2ème numéro
              'gites-etape_et_sejour': 188586,          # Remplacez 333333 par votre 3ème numéro
              'chambres_d_hotes': 188589,       # ...
              'villages_vacances': 188594,
              'refuges': 188593
          }
          
          url = 'https://apidae-tourisme.com'
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          
          for nom_fichier, id_selection in selections.items():
              print(f'Extraction de la selection {id_selection} ({nom_fichier})...')
              
              query_structure = {
                  'apiKey': api_key,
                  'projetId': int(project_id) if project_id.isdigit() else project_id,
                  'selectionIds': [int(id_selection)],
                  'responseFields': ['id', 'nom', 'presentation.descriptifCourt', 'localisation.geolocalisation'],
                  'count': 600
              }
              
              try:
                  response = requests.get(url, params={'query': json.dumps(query_structure)}, headers=headers, timeout=45)
                  response.raise_for_status()
                  data = response.json()
              except Exception as e:
                  print(f'Erreur technique sur la selection {id_selection}: {e}')
                  continue
              
              geojson = {'type': 'FeatureCollection', 'features': []}
              objets = data.get('objetsTouristiques', []) if data.get('objetsTouristiques') else data.get('members', [])
              
              for item in objets:
                  localisation = item.get('localisation', {})
                  geoloc = localisation.get('geolocalisation', {}) if localisation else {}
                  if geoloc and geoloc.get('valide') is True:
                      geo_json_data = geoloc.get('geoJson', {}) if geoloc else {}
                      pt = geo_json_data.get('coordinates', []) if geo_json_data else []
                      if pt and len(pt) == 2:
                          try:
                              lon = float(pt[0])
                              lat = float(pt[1])
                              feature = {
                                  'type': 'Feature',
                                  'geometry': {'type': 'Point', 'coordinates': [lon, lat]},
                                  'properties': {
                                      'name': item.get('nom', {}).get('libelleFr', 'Sans nom'),
                                      'description': item.get('presentation', {}).get('descriptifCourt', {}).get('libelleFr', 'Aucune description.')
                                  }
                              }
                              geojson['features'].append(feature)
                          except:
                              continue
              
              nom_final = f'{nom_fichier}.geojson'
              with open(nom_final, 'w', encoding='utf-8') as f:
                  json.dump(geojson, f, ensure_ascii=False, indent=2)
              print(f'Fichier {nom_final} cree avec succes.')
          "

      - name: Sauvegarder les modifications sur GitHub
        run: |
          git config --global user.name 'Apidae Bot'
          git config --global user.email 'bot@github.com'
          git add *.geojson
          git commit -m "Generation des 6 fichiers geojson de categories" || echo "Aucune modification"
          git push origin HEAD:main || git push --force origin HEAD:main
