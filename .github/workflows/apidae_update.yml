name: Actualisation Donnees Apidae

on:
  schedule:
    - cron: '0 2 * * *' # S'exécute automatiquement toutes les nuits à 2h du matin
  workflow_dispatch: # Permet de lancer la mise à jour manuellement d'un clic

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dependances
        run: pip install requests

      - name: Execution du script de conversion
        env:
          APIDAE_API_KEY: ${{ secrets.APIDAE_API_KEY }}
          APIDAE_PROJECT_ID: ${{ secrets.APIDAE_PROJECT_ID }}
        run: |
          python -c "
          import os, requests, json
          
          # Nettoyage des clés secrètes pour enlever d'éventuels espaces invisibles
          api_key = os.environ.get('APIDAE_API_KEY', '').strip()
          project_id = os.environ.get('APIDAE_PROJECT_ID', '').strip()
          
          url = 'https://apidae-tourisme.com'
          
          # Configuration obligatoire exigée par la v002 d'Apidae
          params = {
              'apiKey': api_key,
              'projetId': project_id,
              'responseFields': '@all',
              'query': '{}' # Paramètre obligatoire pour initialiser la recherche v002
          }
          
          try:
              response = requests.get(url, params=params)
              response.raise_for_status()
              data = response.json()
          except Exception as e:
              print('--- ERREUR CRITIQUE DURANT L APPEL APIDAE ---')
              if 'response' in locals():
                  print(f'Code serveur : {response.status_code}')
                  print(f'Contenu renvoye : {response.text[:500]}')
              else:
                  print(f'Erreur : {e}')
              exit(1)
          
          geojson = {
              'type': 'FeatureCollection',
              'features': []
          }
          
          # Apidae stocke les données dans 'objetsTouristiques'
          objets = data.get('objetsTouristiques', [])
          print(f'{len(objets)} objets touristiques trouves dans votre projet.')
          
          for item in objets:
              localisation = item.get('localisation', {})
              geoloc = localisation.get('geolocalisation', {}) if localisation else {}
              
              if geoloc and geoloc.get('valide') is True:
                  geo_json_data = geoloc.get('geoJson', {}) if geoloc else {}
                  pt = geo_json_data.get('coordinates', []) if geo_json_data else []
                  
                  if pt and len(pt) == 2:
                      try:
                          lon = float(pt[0])
                          lat = float(pt[1])
                          
                          feature = {
                              'type': 'Feature',
                              'geometry': {
                                  'type': 'Point',
                                  'coordinates': [lon, lat]
                              },
                              'properties': {
                                  'name': item.get('nom', {}).get('libelleFr', 'Sans nom'),
                                  'description': item.get('presentation', {}).get('descriptifCourt', {}).get('libelleFr', 'Aucune description disponible.')
                              }
                          }
                          geojson['features'].append(feature)
                      except Exception:
                          continue
          
          with open('donnees.geojson', 'w', encoding='utf-8') as f:
              json.dump(geojson, f, ensure_ascii=False, indent=2)
          print('Fichier donnees.geojson genere et pret !')
          "

      - name: Sauvegarder les modifications sur GitHub
        run: |
          git config --global user.name 'Apidae Bot'
          git config --global user.email 'bot@github.com'
          git add donnees.geojson
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour des données Apidae" && git push)
