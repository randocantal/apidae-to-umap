name: Actualisation Donnees Apidae MULTI

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dependances
        run: pip install requests

      - name: Execution du script de conversion
        env:
          APIDAE_API_KEY: ${{ secrets.APIDAE_API_KEY }}
          APIDAE_PROJECT_ID: ${{ secrets.APIDAE_PROJECT_ID }}
        run: |
          python -c "
          import os, requests, json, re
          
          api_key = os.environ.get('APIDAE_API_KEY', '').strip()
          project_id = os.environ.get('APIDAE_PROJECT_ID', '').strip()
          
          url = 'https://api.apidae-tourisme.com/api/v002/recherche/list-objets-touristiques'
          headers = {'User-Agent': 'Mozilla/5.0'}
          
          config_selections = {
              'hotels': '188585',       
              'campings': '188587',     
              'gites_etape_sejour': '188586',        
              'chambres_hotes': '188589',     
              'villages_vacance': '188594',     
              'refuges': '188593'     
          }
          
          for nom_fichier, id_sel in config_selections.items():
              print(f'Extraction de la selection {id_sel}...')
              
              query_structure = {
                  'apiKey': api_key,
                  'projetId': int(project_id) if project_id.isdigit() else project_id,
                  'selectionIds': [int(id_sel)],
                  'responseFields': ['@all'],
                  'count': 600
              }
              
              try:
                  response = requests.get(url, params={'query': json.dumps(query_structure)}, headers=headers, timeout=45)
                  if response.status_code != 200:
                      continue
                  data = response.json()
              except:
                  continue
                  
              objets = data.get('objetsTouristiques', []) if data.get('objetsTouristiques') else data.get('members', [])
              geojson = {'type': 'FeatureCollection', 'features': []}
              
              for item in objets:
                  localisation = item.get('localisation', {})
                  geoloc = localisation.get('geolocalisation', {}) if localisation else {}
                  
                  if geoloc and geoloc.get('valide') is True:
                      geo_json_data = geoloc.get('geoJson', {}) if geoloc else {}
                      pt = geo_json_data.get('coordinates', []) if geo_json_data else []
                      
                      if pt and len(pt) == 2:
                          try:
                              lon = float(pt)
                              lat = float(pt)
                              
                              # 1. Extraction d'Adresse stabilisée
                              adr_data = localisation.get('adresse', {})
                              lignes = [adr_data.get('adresse1'), adr_data.get('adresse2'), adr_data.get('adresse3')]
                              adresse_complete = ', '.join([str(l) for l in lignes if l])
                              cp_ville = f\"{adr_data.get('codePostal', '')} {adr_data.get('commune', {}).get('nom', '')}\".strip()
                              if cp_ville:
                                  adresse_complete = f\"{adresse_complete}, {cp_ville}\" if adresse_complete else cp_ville
                              
                              # 2. Méthode Aspirateur : On cherche les contacts dans TOUT l'objet converti en texte brut
                              texte_brut_objet = json.dumps(item, ensure_ascii=False)
                              
                              tels_trouves = re.findall(r'(?:0[1-9](?:\s*\d{2}){4}|\+33\s*[1-9](?:\s*\d{2}){4})', texte_brut_objet)
                              emails_trouves = re.findall(r'[\w\.-]+@[\w\.-]+\.\w+', texte_brut_objet)
                              webs_trouves = re.findall(r'https?://(?:www\.)?[\w\.-]+\.\w+(?:/[\w\.-]*)*', texte_brut_objet)
                              
                              # Filtrage pour éviter les faux-positifs du serveur Apidae
                              tels_propres = [t for t in tels_trouves if not t.startswith('000')]
                              webs_propres = [w for w in webs_trouves if 'apidae-tourisme' not in w and 'website-files' not in w]
                              
                              tel = tels_propres[0] if tels_propres else 'Non renseigné'
                              email = emails_trouves[0] if emails_trouves else 'Non renseigné'
                              web = webs_propres[0] if webs_propres else 'Non renseigné'
                              
                              geojson['features'].append({
                                  'type': 'Feature',
                                  'geometry': {'type': 'Point', 'coordinates': [lon, lat]},
                                  'properties': {
                                      'name': item.get('nom', {}).get('libelleFr', 'Sans nom'),
                                      'description': item.get('presentation', {}).get('descriptifCourt', {}).get('libelleFr', 'Aucune description disponible.'),
                                      'adresse': adresse_complete if adresse_complete else 'Non renseignée',
                                      'telephone': tel,
                                      'email': email,
                                      'web': web
                                  }
                              })
                          except Exception as e:
                              continue
              
              with open(f'{nom_fichier}.geojson', 'w', encoding='utf-8') as f:
                  json.dump(geojson, f, ensure_ascii=False, indent=2)
              print(f'Fichier {nom_fichier}.geojson genere avec succes.')
          "

      - name: Sauvegarder les modifications sur GitHub
        run: |
          git config --global user.name 'Apidae Bot'
          git config --global user.email 'bot@github.com'
          git add *.geojson
          git commit -m "Extraction universelle des contacts" || echo "Aucune modification"
          git push origin HEAD:main || git push --force origin HEAD:main
