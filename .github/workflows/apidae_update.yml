name: Actualisation Donnees Apidae

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dependances
        run: pip install requests

      - name: Execution du script de conversion
        env:
          APIDAE_API_KEY: ${{ secrets.APIDAE_API_KEY }}
          APIDAE_PROJECT_ID: ${{ secrets.APIDAE_PROJECT_ID }}
        run: |
          python -c "
          import os, requests, json
          
          api_key = os.environ.get('APIDAE_API_KEY', '').strip()
          project_id = os.environ.get('APIDAE_PROJECT_ID', '').strip()
          
          # URL v002 officielle de l'API de consultation de diffusion
          url = 'https://api.apidae-tourisme.com/api/v002/recherche/list-objets-touristiques'
          
          # Structure technique stricte exigée en v002 : l'authentification s'imbrique obligatoirement DANS la query
          query_structure = {
              'apiKey': api_key,
              'projetId': int(project_id) if project_id.isdigit() else project_id,
              'responseFields': ['id', 'nom', 'presentation.descriptifCourt', 'localisation.geolocalisation'],
              'count': 600
          }
          
          params = {
              'query': json.dumps(query_structure)
          }
          
          # En-tête de sécurité pour imiter un navigateur réel et éviter le blocage de la passerelle OpenResty
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }
          
          try:
              # Appel en méthode GET pure avec en-têtes appropriés
              response = requests.get(url, params=params, headers=headers, timeout=45)
              response.raise_for_status()
              data = response.json()
          except Exception as e:
              print('--- ERREUR DURANT L APPEL APIDAE ---')
              if 'response' in locals():
                  print(f'Code serveur : {response.status_code}')
                  print(f'Contenu renvoye : {response.text[:500]}')
              else:
                  print(f'Erreur : {e}')
              exit(1)
          
          geojson = {
              'type': 'FeatureCollection',
              'features': []
          }
          
          objets = data.get('objetsTouristiques', [])
          if not objets and 'members' in data:
              objets = data.get('members', [])
              
          print(f'{len(objets)} hébergements trouvés dans votre sélection Cantal.')
          
          for item in objets:
              localisation = item.get('localisation', {})
              geoloc = localisation.get('geolocalisation', {}) if localisation else {}
              
              if geoloc and geoloc.get('valide') is True:
                  geo_json_data = geoloc.get('geoJson', {}) if geoloc else {}
                  pt = geo_json_data.get('coordinates', []) if geo_json_data else []
                  
                  if pt and len(pt) == 2:
                      try:
                          lon = float(pt[0]) # Premier index = Longitude
                          lat = float(pt[1]) # Deuxième index = Latitude
                          
                          feature = {
                              'type': 'Feature',
                              'geometry': {
                                  'type': 'Point',
                                  'coordinates': [lon, lat]
                              },
                              'properties': {
                                  'name': item.get('nom', {}).get('libelleFr', 'Sans nom'),
                                  'description': item.get('presentation', {}).get('descriptifCourt', {}).get('libelleFr', 'Aucune description disponible.')
                              }
                          }
                          geojson['features'].append(feature)
                      except Exception:
                          continue
          
          with open('donnees.geojson', 'w', encoding='utf-8') as f:
              json.dump(geojson, f, ensure_ascii=False, indent=2)
          print('Fichier donnees.geojson actualisé avec succès !')
          "

      - name: Sauvegarder les modifications sur GitHub
        run: |
          git config --global user.name 'Apidae Bot'
          git config --global user.email 'bot@github.com'
          git add donnees.geojson
          git commit -m "Mise à jour des hébergements du Cantal" || echo "Aucune modification"
          git push origin HEAD:main || git push --force origin HEAD:main
